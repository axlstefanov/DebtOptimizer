services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: DebtDb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "5154:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Gemini__ApiKey: "${GEMINI_API_KEY}"
      ConnectionStrings__Default: "Host=db;Database=DebtDb;Username=postgres;Password=${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-data: